<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Mart Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <img
                src="https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?auto=format&fit=crop&w=800&q=80"
                alt="Laundry Service"
            >

        </div>


        <!-- Right Section -->
        <div class="right-section">

            <!-- Logo -->
            <div class="logo">
                <span>Laundry<span class="logo-icon">Wallah</span></span>
            </div>


            <!-- Login Content -->
            <div class="login-content">

                <h1>Hello Again!</h1>

                <p class="welcome">
                    Welcome back! We missed you!
                </p>


                <!-- Login Form -->
                <form>

                    <!-- Email -->
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Emailid@site.com"
                    >


                    <!-- Password -->
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                    >


                    <!-- Forgot Password -->
                    <div class="forgot">
                        <a href="#">Forgot Password</a>
                    </div>


                    <!-- Login Button -->
                    <button type="submit">
                        Login
                    </button>

                </form>


                <!-- Register -->
                <p class="register">
                    Not a member?
                    <a href="#">Register Now</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
